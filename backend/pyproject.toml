[project]
name = "evalharness"
version = "0.1.0"
description = "Config-driven evaluation harness for agentic LLM tool use"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "litellm>=1.55",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.27",
    "python-dateutil>=2.9",
]

[project.scripts]
evalharness = "evalharness.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
    "types-python-dateutil>=2.9",
    "aiosqlite>=0.20",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evalharness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "PTH"]
ignore = ["A003", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"evalharness/db/migrations/**" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["evalharness/db/migrations/"]

[[tool.mypy.overrides]]
module = ["litellm.*", "celery.*", "jsonschema.*", "sse_starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's @app.task decorator is untyped; the task functions themselves are annotated.
module = ["evalharness.worker.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["evalharness"]
