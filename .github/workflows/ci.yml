name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The rate limiter's real invariant -- peak requests in a rolling minute,
    # shared across OS processes -- can only be tested against a real Redis. That
    # test was skipped everywhere, including here, which is how a per-process
    # window could have shipped unnoticed (DECISIONS D32, D39).
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 127.0.0.1, not localhost: redis-py resolves localhost to ::1 first, and a
      # GitHub service container publishes on IPv4 only, so the first connect
      # attempt fails. The limiter fails open on a connection error, so that
      # surfaces as a window breach rather than as a connection problem (D45).
      EVALHARNESS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy .
      # deploy/ is real Python that runs in production (it migrates and seeds the
      # public demo), but it lives outside the package so `mypy .` above never
      # reaches it. Checked explicitly rather than left to rot unchecked.
      - name: Ruff and mypy on the deploy scripts
        run: |
          uv run ruff check ../deploy
          uv run ruff format --check ../deploy
          uv run mypy ../deploy/seed.py ../deploy/verify.py
      - name: Pytest
        run: uv run pytest --cov --cov-report=term-missing
      # This guard exists because the limiter test was once skipif-guarded on an
      # env var nothing in CI set, so the only test that could catch a per-process
      # window had never run (D32, D39). Running it when earlier steps failed is
      # part of the guard, not a convenience: a failing Pytest step used to skip
      # this one, and a skipped step is not reported red, so an absent result read
      # exactly like a pass (D46). `!cancelled()` rather than `always()` because
      # this workflow sets cancel-in-progress, and a cancelled run has genuinely
      # not determined anything.
      #
      # Every branch below that is not an observed pass exits non-zero. A check
      # that cannot determine its own answer must fail, never stay silent (D38).
      - name: The cross-process limiter test must have run, not been skipped
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          uv run pytest tests/test_ratelimit_window.py -k test_separate_processes_share_one_window -q --no-header -rN --strict-markers > /tmp/limiter.txt 2>&1 || status=$?
          cat /tmp/limiter.txt
          if grep -qE '1 passed' /tmp/limiter.txt; then
            echo "the cross-process limiter test ran and passed"
            exit 0
          fi
          if grep -qE '[0-9]+ skipped' /tmp/limiter.txt; then
            echo "::error::the cross-process limiter test was SKIPPED, so nothing"
            echo "::error::checked that the rolling window is shared across"
            echo "::error::processes. EVALHARNESS_TEST_REDIS_URL is not reaching"
            echo "::error::pytest. This is the D39 failure, not a pass."
            exit 1
          fi
          if grep -qE 'no tests ran|collected 0 items' /tmp/limiter.txt; then
            echo "::error::no test matched -k test_separate_processes_share_one_window."
            echo "::error::If it was renamed, update this guard: a guard that matches"
            echo "::error::nothing is indistinguishable from no guard at all."
            exit 1
          fi
          echo "::error::could not determine whether the cross-process limiter test"
          echo "::error::ran (pytest exit ${status}). An undetermined result is"
          echo "::error::reported as a failure on purpose -- see D38, D46."
          exit 1

  scenarios:
    name: Validate scenarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: evalharness validate
        run: uv run evalharness validate

  contract:
    name: API contract is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv python install 3.12
      - run: uv sync --all-groups
        working-directory: backend
      - name: Dump the OpenAPI schema
        working-directory: backend
        run: |
          uv run python -c "import json;from evalharness.api.app import create_app;print(json.dumps(create_app().openapi(), indent=1))" > ../openapi.json
      - run: npm ci
        working-directory: web
      - name: Regenerate the frontend API types
        working-directory: web
        run: npm run gen:api
      - name: Fail if the committed types are stale
        run: |
          git diff --exit-code -- openapi.json web/lib/api-types.ts             || { echo "::error::API changed but the generated types were not regenerated. Run 'npm run gen:api' in web/ and commit."; exit 1; }

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
