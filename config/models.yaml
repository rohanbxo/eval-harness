# Model registry (SPEC 7). Adding a model requires only a new entry here.
#
# Everything goes through OpenRouter, and every entry pins the upstream host it
# may be served by (DECISIONS D20). OpenRouter serves one slug from many hosts
# that differ in quantization, context window and tool-calling fidelity; without
# a pin, a re-route is indistinguishable from a model regression.
#
# `reasoning_effort` is per model because the supported values differ. The
# intent across this set is "medium", mapped to the nearest value each model
# actually accepts.
models:
  - key: gpt-5.6-terra
    display_name: "OpenAI GPT-5.6 Terra"
    litellm_model: "openrouter/openai/gpt-5.6-terra"
    # No temperature: this endpoint does not list `temperature` among its
    # supported parameters, so sending it filters the endpoint out entirely
    # (DECISIONS D22). Reasoning models of this family are not temperature-
    # controllable; k=3 and pass^k are what measure the resulting variance.
    params: {}
    reasoning_effort: medium
    provider_routing:
      order: [openai]
      allow_fallbacks: false
    supports_parallel_tool_calls: true
    api_key_env: OPENROUTER_API_KEY

  - key: claude-sonnet-5
    display_name: "Anthropic Claude Sonnet 5"
    litellm_model: "openrouter/anthropic/claude-sonnet-5"
    # No temperature, for the same reason as gpt-5.6-terra above (D22).
    params: {}
    reasoning_effort: medium
    provider_routing:
      order: [anthropic]
      allow_fallbacks: false
    supports_parallel_tool_calls: true
    api_key_env: OPENROUTER_API_KEY

  - key: deepseek-v4-pro
    display_name: "DeepSeek V4 Pro"
    litellm_model: "openrouter/deepseek/deepseek-v4-pro-0813"
    params: {temperature: 0}
    # DeepSeek V4 offers only high/xhigh, so "medium" maps up to high.
    reasoning_effort: high
    provider_routing:
      # DeepSeek's own endpoint IS listed by the endpoints API but is not
      # routable: pinning `deepseek` 404s even with fallbacks allowed, while the
      # slug routes fine unpinned. Fireworks is the substitute -- full 1M
      # context, tool calling confirmed in pre-flight, and not declared as a
      # quantized endpoint (unlike the fp8/fp4 hosts). See DECISIONS D22.
      order: [fireworks]
      allow_fallbacks: false
    supports_parallel_tool_calls: true
    api_key_env: OPENROUTER_API_KEY

  - key: gpt-oss-120b-groq
    display_name: "GPT-OSS 120B (Groq)"
    litellm_model: "openrouter/openai/gpt-oss-120b"
    params: {temperature: 0}
    reasoning_effort: medium
    provider_routing:
      order: [groq]
      allow_fallbacks: false
    supports_parallel_tool_calls: true
    api_key_env: OPENROUTER_API_KEY
